<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ECM50-A 設備健康監測儀表板</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#ecfdf5',
                            500: '#10b981',
                            600: '#059669',
                            900: '#064e3b',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- LINE LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        .pulse-glow-green { animation: glow-green 2s infinite; }
        .pulse-glow-yellow { animation: glow-yellow 2s infinite; }
        .pulse-glow-red { animation: glow-red 1.5s infinite; }
        @keyframes glow-green { 0%, 100% { box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); } 50% { box-shadow: 0 0 30px rgba(16, 185, 129, 0.8); } }
        @keyframes glow-yellow { 0%, 100% { box-shadow: 0 0 15px rgba(245, 158, 11, 0.4); } 50% { box-shadow: 0 0 30px rgba(245, 158, 11, 0.8); } }
        @keyframes glow-red { 0%, 100% { box-shadow: 0 0 20px rgba(239, 68, 68, 0.6); } 50% { box-shadow: 0 0 40px rgba(239, 68, 68, 1); } }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans pb-10">
    <!-- 頂部導覽列與 User Profile -->
    <header class="bg-slate-900/80 backdrop-blur border-b border-slate-800 sticky top-0 z-50 px-4 py-3">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400 font-bold text-lg">
                    <i class="fa-solid fa-microchip"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base leading-tight">ECM50-A 旋轉設備監控</h1>
                    <p class="text-xs text-slate-400 flex items-center gap-1">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block animate-ping"></span>
                        4G 即時連線中 (Supabase)
                    </p>
                </div>
            </div>
            <!-- LINE Profile 區塊 -->
            <div id="userProfile" class="flex items-center gap-2 bg-slate-800/60 px-3 py-1.5 rounded-full border border-slate-700/50">
                <img id="userAvatar" class="w-6 h-6 rounded-full hidden" src="" alt="Avatar">
                <span id="userName" class="text-xs text-slate-300 font-medium">連線中...</span>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 mt-4 space-y-4">
        <!-- 狀態總覽大燈號卡片 -->
        <div id="statusCard" class="rounded-2xl bg-slate-900 border border-slate-800 p-5 transition-all duration-300 pulse-glow-green">
            <div class="flex items-center justify-between">
                <div>
                    <span id="statusBadge" class="px-2.5 py-1 rounded-md text-xs font-semibold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
                        🟢 設備狀態良好 (Normal)
                    </span>
                    <h2 class="text-2xl font-bold mt-2 text-white">主軸馬達 M01</h2>
                    <p id="statusDesc" class="text-xs text-slate-400 mt-1">即時健康評分穩定，無異常振動頻譜</p>
                </div>
                <div class="text-right">
                    <div id="healthScoreDisplay" class="text-4xl font-extrabold text-emerald-400">--</div>
                    <div class="text-[10px] text-slate-400 uppercase tracking-wider mt-1">Health Score</div>
                </div>
            </div>
        </div>

        <!-- 4 大關鍵數據卡片 Grid -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
            <!-- RMS 振動 -->
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
                <div class="flex justify-between items-center text-slate-400 text-xs mb-1">
                    <span>振動速度 RMS</span>
                    <i class="fa-solid fa-wave-square text-emerald-400"></i>
                </div>
                <div class="flex items-baseline gap-1">
                    <span id="valRms" class="text-2xl font-bold text-white">--</span>
                    <span class="text-xs text-slate-400">mm/s</span>
                </div>
                <div class="w-full bg-slate-800 h-1.5 rounded-full mt-3 overflow-hidden">
                    <div id="barRms" class="bg-emerald-500 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>

            <!-- 峭度 K 值 -->
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
                <div class="flex justify-between items-center text-slate-400 text-xs mb-1">
                    <span>衝擊峭度 (K值)</span>
                    <i class="fa-solid fa-chart-line text-blue-400"></i>
                </div>
                <div class="flex items-baseline gap-1">
                    <span id="valK" class="text-2xl font-bold text-white">--</span>
                    <span class="text-xs text-slate-400">Kurtosis</span>
                </div>
                <div class="w-full bg-slate-800 h-1.5 rounded-full mt-3 overflow-hidden">
                    <div id="barK" class="bg-blue-500 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>

            <!-- 馬達溫度 -->
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
                <div class="flex justify-between items-center text-slate-400 text-xs mb-1">
                    <span>軸承溫度</span>
                    <i class="fa-solid fa-temperature-three-quarters text-orange-400"></i>
                </div>
                <div class="flex items-baseline gap-1">
                    <span id="valTemp" class="text-2xl font-bold text-white">--</span>
                    <span class="text-xs text-slate-400">°C</span>
                </div>
                <div class="w-full bg-slate-800 h-1.5 rounded-full mt-3 overflow-hidden">
                    <div id="barTemp" class="bg-orange-500 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>

            <!-- 健康度分級 -->
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
                <div class="flex justify-between items-center text-slate-400 text-xs mb-1">
                    <span>健康指數</span>
                    <i class="fa-solid fa-heart-pulse text-purple-400"></i>
                </div>
                <div class="flex items-baseline gap-1">
                    <span id="valHealth" class="text-2xl font-bold text-white">--</span>
                    <span class="text-xs text-slate-400">/ 100</span>
                </div>
                <div class="w-full bg-slate-800 h-1.5 rounded-full mt-3 overflow-hidden">
                    <div id="barHealth" class="bg-purple-500 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <!-- 折線圖表區塊 -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-sm text-slate-200 flex items-center gap-2">
                    <i class="fa-solid fa-chart-area text-emerald-400"></i>
                    近 50 筆心跳數據趨勢
                </h3>
                <div class="flex gap-1 bg-slate-800 p-1 rounded-lg text-xs">
                    <button onclick="switchChartMetric('rms')" id="btnRms" class="px-2.5 py-1 rounded-md bg-emerald-500 text-white font-medium">RMS</button>
                    <button onclick="switchChartMetric('health')" id="btnHealth" class="px-2.5 py-1 rounded-md text-slate-400 hover:text-white">健康度</button>
                    <button onclick="switchChartMetric('temp')" id="btnTemp" class="px-2.5 py-1 rounded-md text-slate-400 hover:text-white">溫度</button>
                </div>
            </div>
            <div class="h-64 relative">
                <canvas id="telemetryChart"></canvas>
            </div>
        </div>

        <!-- 最新歷史數據表 -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 overflow-hidden">
            <h3 class="font-bold text-sm text-slate-200 mb-3 flex items-center gap-2">
                <i class="fa-solid fa-list text-slate-400"></i>
                即時 telemetry 紀錄
            </h3>
            <div class="overflow-x-auto">
                <table class="w-full text-xs text-left text-slate-300">
                    <thead class="text-slate-500 bg-slate-800/50 uppercase border-b border-slate-800">
                        <tr>
                            <th class="py-2.5 px-3">時間</th>
                            <th class="py-2.5 px-3">Health</th>
                            <th class="py-2.5 px-3">RMS (mm/s)</th>
                            <th class="py-2.5 px-3">K 值</th>
                            <th class="py-2.5 px-3">溫度 (°C)</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody" class="divide-y divide-slate-800/50">
                        <tr><td colspan="5" class="text-center py-4 text-slate-500">載入數據中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        // =========================================================================
        // ⚙️ 專案參數設定
        // =========================================================================
        const SUPABASE_HOST = "vwygjksecwutyoqfimka.supabase.co";
        const SUPABASE_KEY  = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ3eWdqa3NlY3d1dHlvcWZpbWthIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0ODEyNzMsImV4cCI6MjEwNTA1NzI3M30.eWwHDOIgneNRTkpuAu-ZQp-xb-wKG7f_nA5XTlQZLmU";
        
        // 🔒 已更新為您的實體 LIFF ID
        const LIFF_ID = '2012197173-6r4CzJ9e';

        let chartInstance = null;
        let globalRawData = [];
        let currentMetric = 'rms';

        // 初始化 LINE LIFF
        async function initLiff() {
            try {
                if (LIFF_ID !== 'YOUR_LIFF_ID') {
                    await liff.init({ liffId: LIFF_ID });
                    if (liff.isLoggedIn()) {
                        const profile = await liff.getProfile();
                        document.getElementById('userName').innerText = profile.displayName;
                        const avatar = document.getElementById('userAvatar');
                        avatar.src = profile.pictureUrl;
                        avatar.classList.remove('hidden');
                    } else {
                        document.getElementById('userName').innerText = '未登入 (Web 測試模式)';
                    }
                } else {
                    document.getElementById('userName').innerText = '網頁測試模式';
                }
            } catch (err) {
                console.warn('LIFF 初始化失敗或處於非 LINE 環境:', err);
                document.getElementById('userName').innerText = '現場維護員';
            }
        }

        // 從 Supabase 拉取最新 50 筆紀錄
        async function fetchSupabaseData() {
            try {
                const url = `https://${SUPABASE_HOST}/rest/v1/device_telemetry?select=*&order=created_at.desc&limit=50`;
                const res = await fetch(url, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });
                if (!res.ok) throw new Error('API 回應錯誤');
                const data = await res.json();
                
                if (data && data.length > 0) {
                    globalRawData = data;
                    updateUI(data[0]);
                    renderTable(data);
                    renderChart(data, currentMetric);
                }
            } catch (err) {
                console.error('拉取 Supabase 失敗:', err);
            }
        }

        // 更新頂部卡片與關鍵數據
        function updateUI(latest) {
            const health = latest.health_score || 0;
            const rms = (latest.rms_val || 0).toFixed(2);
            const k = (latest.k_val || 0).toFixed(2);
            const temp = (latest.temp_val || 0).toFixed(1);

            document.getElementById('valRms').innerText = rms;
            document.getElementById('valK').innerText = k;
            document.getElementById('valTemp').innerText = temp;
            document.getElementById('valHealth').innerText = health;
            document.getElementById('healthScoreDisplay').innerText = health;

            document.getElementById('barRms').style.width = Math.min((rms / 5.0) * 100, 100) + '%';
            document.getElementById('barK').style.width = Math.min((k / 6.0) * 100, 100) + '%';
            document.getElementById('barTemp').style.width = Math.min((temp / 80.0) * 100, 100) + '%';
            document.getElementById('barHealth').style.width = health + '%';

            const card = document.getElementById('statusCard');
            const badge = document.getElementById('statusBadge');
            const desc = document.getElementById('statusDesc');
            const healthDisplay = document.getElementById('healthScoreDisplay');

            card.className = "rounded-2xl bg-slate-900 border border-slate-800 p-5 transition-all duration-300 ";

            if (health >= 85) {
                card.classList.add('pulse-glow-green');
                badge.className = "px-2.5 py-1 rounded-md text-xs font-semibold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
                badge.innerText = "🟢 設備狀態良好 (Normal)";
                desc.innerText = "即時健康評分穩定，無異常振動頻譜";
                healthDisplay.className = "text-4xl font-extrabold text-emerald-400";
            } else if (health >= 70) {
                card.classList.add('pulse-glow-yellow');
                badge.className = "px-2.5 py-1 rounded-md text-xs font-semibold bg-amber-500/20 text-amber-400 border border-amber-500/30";
                badge.innerText = "🟡 注意：出現輕微磨損 (Warning)";
                desc.innerText = "振動 RMS 或峭度上升，請排程點檢";
                healthDisplay.className = "text-4xl font-extrabold text-amber-400";
            } else {
                card.classList.add('pulse-glow-red');
                badge.className = "px-2.5 py-1 rounded-md text-xs font-semibold bg-rose-500/20 text-rose-400 border border-rose-500/30";
                badge.innerText = "🔴 警報：設備異常 (Critical)";
                desc.innerText = "超越安全 Baseline 門檻，建議立即停機檢修";
                healthDisplay.className = "text-4xl font-extrabold text-rose-400";
            }
        }

        // 渲染表格
        function renderTable(data) {
            const tbody = document.getElementById('historyTableBody');
            tbody.innerHTML = data.slice(0, 10).map(row => {
                const dateStr = new Date(row.created_at).toLocaleTimeString('zh-TW', { hour12: false });
                return `
                    <tr class="hover:bg-slate-800/30">
                        <td class="py-2 px-3 font-mono text-slate-400">${dateStr}</td>
                        <td class="py-2 px-3 font-bold ${row.health_score < 75 ? 'text-rose-400' : 'text-emerald-400'}">${row.health_score}</td>
                        <td class="py-2 px-3">${(row.rms_val || 0).toFixed(2)}</td>
                        <td class="py-2 px-3">${(row.k_val || 0).toFixed(2)}</td>
                        <td class="py-2 px-3">${(row.temp_val || 0).toFixed(1)}</td>
                    </tr>
                `;
            }).join('');
        }

        // 渲染 Chart.js 趨勢圖
        function renderChart(data, metric) {
            const ctx = document.getElementById('telemetryChart').getContext('2d');
            const reversed = [...data].reverse();
            const labels = reversed.map(d => new Date(d.created_at).toLocaleTimeString('zh-TW', { hour12: false, minute: '2-digit', second: '2-digit' }));
            
            let datasetConfig = {};
            if (metric === 'rms') {
                datasetConfig = {
                    label: 'RMS 振動 (mm/s)',
                    data: reversed.map(d => d.rms_val),
                    borderColor: '#10b981',
                    backgroundColor: 'rgba(16, 185, 129, 0.1)',
                };
            } else if (metric === 'health') {
                datasetConfig = {
                    label: '健康得分',
                    data: reversed.map(d => d.health_score),
                    borderColor: '#a855f7',
                    backgroundColor: 'rgba(168, 85, 247, 0.1)',
                };
            } else if (metric === 'temp') {
                datasetConfig = {
                    label: '軸承溫度 (°C)',
                    data: reversed.map(d => d.temp_val),
                    borderColor: '#f97316',
                    backgroundColor: 'rgba(249, 115, 22, 0.1)',
                };
            }

            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        ...datasetConfig,
                        fill: true,
                        tension: 0.3,
                        borderWidth: 2,
                        pointRadius: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: '#64748b', maxTicksLimit: 6 } },
                        y: { grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: '#64748b' } }
                    }
                }
            });
        }

        function switchChartMetric(metric) {
            currentMetric = metric;
            document.querySelectorAll('[id^="btn"]').forEach(btn => {
                btn.className = "px-2.5 py-1 rounded-md text-slate-400 hover:text-white";
            });
            const activeBtn = document.getElementById('btn' + metric.charAt(0).toUpperCase() + metric.slice(1));
            if (activeBtn) activeBtn.className = "px-2.5 py-1 rounded-md bg-emerald-500 text-white font-medium";
            
            if (globalRawData.length > 0) renderChart(globalRawData, metric);
        }

        // 初始化與定時輪詢
        window.onload = async () => {
            await initLiff();
            await fetchSupabaseData();
            setInterval(fetchSupabaseData, 10000); // 每 10 秒自動更新
        };
    </script>
</body>
</html>
